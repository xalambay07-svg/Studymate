<!DOCTYPE html>
<html lang="vi" data-theme="cosmic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — StudyMate</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem;">

  <div class="st-card" style="width: 100%; max-width: 420px; padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="st-logo" style="justify-content: center; font-size: 1.5rem; margin-bottom: 0.5rem;">
        <div class="st-logo-icon">📖</div>
        <span>Studies<span class="accent-word">Mate</span></span>
      </a>
      <p style="color: var(--theme-text-muted); font-size: 0.8125rem;">
        Đăng nhập vào không gian quản lý học tập thông minh
      </p>
    </div>

    <form id="loginForm">
      <div style="margin-bottom: 1.25rem;">
        <label style="font-size: 0.75rem; color: var(--theme-text-muted); display: block; margin-bottom: 0.35rem; text-transform: uppercase;">Email sinh viên / Admin</label>
        <input type="email" id="email" class="form-control" value="student@studymate.edu.vn" required>
      </div>

      <div style="margin-bottom: 1.25rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
          <label style="font-size: 0.75rem; color: var(--theme-text-muted); text-transform: uppercase;">Mật khẩu</label>
          <a href="#" style="font-size: 0.75rem;">Quên mật khẩu?</a>
        </div>
        <input type="password" id="password" class="form-control" value="123456" required>
      </div>

      <button type="submit" class="st-pill-btn st-pill-btn-primary" style="width: 100%; padding: 0.75rem; justify-content: center; margin-top: 0.5rem;">
        Đăng nhập ngay
      </button>
    </form>

    <div style="margin-top: 1.5rem; padding: 0.75rem 1rem; border-radius: 10px; background: var(--theme-card-active); border: 1px solid var(--theme-border); font-size: 0.75rem; color: var(--theme-text-secondary); line-height: 1.6;">
      <strong>Tài khoản demo có sẵn:</strong><br>
      • Sinh viên: <code>student@studymate.edu.vn</code> (MK: <code>123456</code>)<br>
      • Admin: <code>admin@studymate.edu.vn</code> (MK: <code>admin123</code>)
    </div>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.8125rem; color: var(--theme-text-muted);">
      Chưa có tài khoản? <a href="register.html" style="color: var(--theme-primary); font-weight: 500;">Đăng ký miễn phí</a><br>
      <a href="index.html" style="font-size: 0.75rem; display: inline-block; margin-top: 0.75rem; color: var(--theme-text-secondary);">&larr; Quay về trang chủ</a>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
