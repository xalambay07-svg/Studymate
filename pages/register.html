<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản – StudyMate</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-body);">

  <div class="card" style="width: 100%; max-width: 440px; margin: 1.5rem; box-shadow: var(--shadow-lg);">
    <div class="card-body" style="padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="logo-brand" style="justify-content: center; font-size: 1.5rem; margin-bottom: 0.5rem;">
          📚 StudyMate
        </div>
        <p style="color: var(--text-muted); font-size: 0.875rem;">Đăng ký để tự động hóa kế hoạch học tập của bạn</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="fullName">Họ và tên sinh viên</label>
          <input type="text" id="fullName" class="form-control" placeholder="Nguyễn Văn A" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email trường / cá nhân</label>
          <input type="email" id="regEmail" class="form-control" placeholder="tensinhvien@studymate.edu.vn" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Mật khẩu</label>
          <input type="password" id="regPassword" class="form-control" placeholder="Tối thiểu 6 ký tự" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 1rem;">
          Tạo tài khoản StudyMate
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
        Đã có tài khoản? <a href="login.html" style="font-weight: 600;">Đăng nhập tại đây</a><br>
        <a href="index.html" style="font-size: 0.8125rem; display: inline-block; margin-top: 0.5rem;">&larr; Về trang chủ</a>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
