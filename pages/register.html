<!DOCTYPE html>
<html lang="vi" data-theme="cosmic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký — StudyMate</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem;">

  <div class="st-card" style="width: 100%; max-width: 440px; padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="st-logo" style="justify-content: center; font-size: 1.5rem; margin-bottom: 0.5rem;">
        <div class="st-logo-icon">📖</div>
        <span>Studies<span class="accent-word">Mate</span></span>
      </a>
      <p style="color: var(--theme-text-muted); font-size: 0.8125rem;">
        Tạo tài khoản sinh viên để quản lý học tập thông minh
      </p>
    </div>

    <form id="registerForm">
      <div style="margin-bottom: 1.25rem;">
        <label style="font-size: 0.75rem; color: var(--theme-text-muted); display: block; margin-bottom: 0.35rem; text-transform: uppercase;">Họ và tên</label>
        <input type="text" id="fullName" class="form-control" placeholder="Nguyễn Văn A" required>
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="font-size: 0.75rem; color: var(--theme-text-muted); display: block; margin-bottom: 0.35rem; text-transform: uppercase;">Email trường</label>
        <input type="email" id="regEmail" class="form-control" placeholder="tensinhvien@studymate.edu.vn" required>
      </div>

      <div style="margin-bottom: 1.25rem;">
        <label style="font-size: 0.75rem; color: var(--theme-text-muted); display: block; margin-bottom: 0.35rem; text-transform: uppercase;">Mật khẩu</label>
        <input type="password" id="regPassword" class="form-control" placeholder="Tối thiểu 6 ký tự" required minlength="6">
      </div>

      <button type="submit" class="st-pill-btn st-pill-btn-primary" style="width: 100%; padding: 0.75rem; justify-content: center; margin-top: 0.5rem;">
        Tạo tài khoản ngay
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.8125rem; color: var(--theme-text-muted);">
      Đã có tài khoản? <a href="login.html" style="color: var(--theme-primary); font-weight: 500;">Đăng nhập</a><br>
      <a href="index.html" style="font-size: 0.75rem; display: inline-block; margin-top: 0.75rem; color: var(--theme-text-secondary);">&larr; Quay về trang chủ</a>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
